modLoader = "javafml"
loaderVersion = "[2,)"
#issueTrackerURL = ""
license = "All Rights Reserved"

[[mods]]
modId = "create_italian_industries"
version = "${version}"
displayName = "Create Italian Industries"
authors = "alexzander700"
description = '''
Create: Italian Industries is a mod to add many Italian foods to the game to give some variety to the foods in game.
'''
#logoFile = ""

[[dependencies.create_italian_industries]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_italian_industries]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.create_italian_industries]]
modId = "architectury"
type = "required"
versionRange = "[13.0.11,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.create_italian_industries]]
modId = "create"
type = "required"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

# Tomatoes come from Create: Crops, so Tomato Sauce is only craftable when it is installed.
# "[0,)" because a "1.0-SNAPSHOT" version sorts below 1.0 and would be rejected by "[1.0,)".
[[dependencies.create_italian_industries]]
modId = "create_crops"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "create_italian_industries.mixins.json"
